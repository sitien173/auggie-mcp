[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auggie-mcp"
version = "0.3.0"
description = "Python MCP server exposing codebase retrieval through an ephemeral Pi subprocess"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "typesafe-sdk",
]

[project.scripts]
auggie-mcp = "auggie_mcp.server:run"
auggie = "auggie_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auggie_mcp"]
include = ["system_prompt.md"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
]

[tool.coverage.run]
source = ["auggie_mcp"]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"
