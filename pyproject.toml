[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auggie-mcp"
version = "0.2.0"
description = "Python MCP server exposing codebase retrieval through an ephemeral Pi subprocess"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "typesafe-sdk",
]

[project.scripts]
auggie-mcp = "auggie_mcp.server:run"
auggie = "auggie_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auggie_mcp"]
include = ["system_prompt.md"]
