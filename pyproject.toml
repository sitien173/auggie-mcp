[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auggie-mcp"
version = "0.5.0"
description = "Python MCP server exposing codebase retrieval through a coding-agent CLI"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "typesafe-sdk",
    "lancedb==0.33.0",
    "numpy==2.5.0",
    "pyarrow==24.0.0",
    "tqdm==4.68.3",
    "tree-sitter==0.25.2",
    "voyageai==0.4.1",
    "watchdog==6.0.0",
    "coding-agent-cli==0.1.0",
]

[project.scripts]
auggie-mcp = "auggie_mcp.server:run"
auggie = "auggie_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auggie_mcp", "src/auggie"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest",
]

[tool.coverage.run]
source = ["auggie_mcp"]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests/semantic"]
addopts = "-ra -p no:cacheprovider"
