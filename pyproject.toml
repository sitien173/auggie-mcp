[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auggie-mcp"
version = "0.5.0"
description = "Python MCP server exposing codebase retrieval through a coding-agent CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tien Ngo" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "numpy==2.5.4",
    "voyageai==0.4.1",
    "coding-agent-cli==0.1.0",
]

[project.scripts]
auggie-mcp = "auggie_mcp.launch:server"
auggie = "auggie_mcp.launch:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/auggie_mcp"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest",
    "ruff",
    "ty",
]

[tool.coverage.run]
source = ["auggie_mcp"]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
src = ["src"]

[tool.ty.src]
include = ["src"]
