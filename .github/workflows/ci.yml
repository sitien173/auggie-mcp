name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run tests with coverage
        run: |
          uv run --frozen --python ${{ matrix.python-version }} coverage run -m pytest tests
          uv run --frozen --python ${{ matrix.python-version }} coverage report
      - name: Check lint
        run: uv run --frozen ruff check src tests scripts
      - name: Check types
        run: uv run --frozen ty check src
      - name: Check versions
        run: uv run --frozen python scripts/check_versions.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check lockfile
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build
